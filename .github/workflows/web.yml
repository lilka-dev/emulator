name: Web
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  EMSDK_VERSION: 7.0.1
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        # Host GLib tools and venv as in QEMU's own Emscripten recipe.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config patch python3-venv libglib2.0-dev-bin
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Rust target
        run: |
          rustup target add wasm32-unknown-emscripten
          rustup component add rust-src
      - uses: actions/cache@v4
        with:
          path: .build/web/sysroot
          key: web-sysroot-${{ env.EMSDK_VERSION }}-${{ hashFiles('web/build.py') }}
      - name: Build
        run: python3 web/build.py --jobs 4
      - name: Boot KeiraOS headless
        run: |
          node=$(ls -d "$EMSDK"/node/*/bin | tail -1)/node
          "$node" web/test/boot.mjs firmware/KeiraOS_merged_LANG_UK.bin 120 --frame keira.ppm
      - name: Package
        run: tar -czf lilka-emulator-web.tar.gz -C dist web
      - uses: actions/upload-artifact@v4
        with:
          name: lilka-emulator-web
          path: |
            lilka-emulator-web.tar.gz
            keira.ppm
      - name: Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  # Publishes dist/web as a static site. GitHub Pages cannot send the COOP/COEP
  # headers threads need; web/static/coi-serviceworker.js adds them instead.
  # One-time setup: Settings -> Pages -> Source: GitHub Actions.
  pages:
    needs: wasm
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
