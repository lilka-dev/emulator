name: Desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package
        run: |
          dist/lilka-emulator/lilka-emulator --cpu-only --version
          tar -czf lilka-emulator-linux-x86_64.tar.gz -C dist lilka-emulator
      - uses: actions/upload-artifact@v4
        with:
          name: lilka-emulator-linux-x86_64
          path: lilka-emulator-linux-x86_64.tar.gz
