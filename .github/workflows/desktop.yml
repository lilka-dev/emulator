name: Desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils git patch curl ca-certificates \
            ninja-build pkg-config python3 python3-dev python3-venv python3-pip \
            python3-setuptools python3-packaging python3-distlib libglib2.0-dev libpixman-1-dev libgcrypt20-dev \
            libfdt-dev zlib1g-dev libasound2-dev libudev-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: LILKA_DATA_DIR="$RUNNER_TEMP/lilka-tests" cargo test --workspace --lib --locked
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: lilka-emulator-linux-x86_64
          path: dist/lilka-emulator
