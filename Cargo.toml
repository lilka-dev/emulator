[package]
name = "lilka-emulator"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
autobins = false
autoexamples = false
autotests = false

[workspace]
members = ["crates/lilka-board", "crates/lilka-qemu-bridge"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
lilka-board = { path = "crates/lilka-board" }
anyhow = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "image-without-codecs", "tokio", "fira-sans", "x11", "wayland"] }
rfd = "0.17"
maudio = "0.1.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

